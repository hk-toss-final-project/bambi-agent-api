# 로컬 Agent DB의 PostgreSQL 17과 pgvector 실행 환경을 정의한다.

name: bambi-agent-api

services:
  agent-db:
    # PostgreSQL 17.9 미만은 쓰지 않는다. 17.8에는 UTF-8 본문에서 substring()·
    # left()가 "invalid byte sequence for encoding UTF8"로 실패하는 버그가 있다
    # (PostgreSQL BUG #19406, CVE-2026-2006 수정이 과했던 회귀). 한국어 본문은
    # TOAST 대상이라 그대로 걸린다. 이 태그는 PostgreSQL 17.10을 담고 있다.
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_DB_NAME:-bambi_agent}
      POSTGRES_USER: ${AGENT_DB_USER:-bambi_agent}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD must be set in .env}
      AGENT_DB_APPLY_DEV_SEEDS: ${AGENT_DB_APPLY_DEV_SEEDS:-true}
    ports:
      - "127.0.0.1:${AGENT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB && PGHOST=127.0.0.1 /bin/sh /usr/local/bin/initialize-agent-db --check"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - agent-db-data:/var/lib/postgresql/data
      - ./database/migrations:/opt/bambi/migrations:ro
      - ./database/seeds:/opt/bambi/seeds:ro
      - ./scripts/run_agent_db_migrations.sh:/usr/local/bin/run-agent-db-migrations:ro
      - ./scripts/initialize_agent_db.sh:/usr/local/bin/initialize-agent-db:ro
    post_start:
      - command: /bin/sh /usr/local/bin/initialize-agent-db
        user: postgres

  # 로컬에서 API만 띄워 queued Job이 영구 대기하는 실수를 막기 위한 명시적 Worker.
  # 실제 LLM 비용이 발생하므로 기본 `docker compose up`에는 포함하지 않고
  # `--profile workers`를 지정했을 때만 실행한다.
  agent-worker-wiki:
    profiles: ["workers"]
    build: .
    command:
      - python
      - -m
      - workers.main
      - --worker
      - personal-wiki
      - --loop
      - --interval-seconds
      - "5"
    environment:
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-bambi_agent}:${AGENT_DB_PASSWORD}@agent-db:5432/${AGENT_DB_NAME:-bambi_agent}
      VECTOR_STORE_URL: postgresql://${AGENT_DB_USER:-bambi_agent}:${AGENT_DB_PASSWORD}@agent-db:5432/${AGENT_DB_NAME:-bambi_agent}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      WIKI_LLM_MODEL: ${WIKI_LLM_MODEL:-gpt-4o-mini}
      PERSONAL_WIKI_WORKER_BATCH_SIZE: ${PERSONAL_WIKI_WORKER_BATCH_SIZE:-20}
      PERSONAL_WIKI_JOB_LEASE_SECONDS: ${PERSONAL_WIKI_JOB_LEASE_SECONDS:-1800}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      agent-db:
        condition: service_healthy
    restart: unless-stopped

  # 생성 Job도 같은 로컬 프로필에서 별도 프로세스로 소비한다. Wiki와 Report는
  # 서로 다른 모델 설정을 사용하므로 운영 구조와 같이 Worker를 분리한다.
  agent-worker-report:
    profiles: ["workers"]
    build: .
    command:
      - python
      - -m
      - workers.main
      - --worker
      - report-generation
      - --loop
      - --interval-seconds
      - "5"
    environment:
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER:-bambi_agent}:${AGENT_DB_PASSWORD}@agent-db:5432/${AGENT_DB_NAME:-bambi_agent}
      VECTOR_STORE_URL: postgresql://${AGENT_DB_USER:-bambi_agent}:${AGENT_DB_PASSWORD}@agent-db:5432/${AGENT_DB_NAME:-bambi_agent}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      REPORT_LLM_MODEL: ${REPORT_LLM_MODEL:-gpt-4o-mini}
      PERSONAL_WIKI_WORKER_BATCH_SIZE: ${PERSONAL_WIKI_WORKER_BATCH_SIZE:-20}
      PERSONAL_WIKI_JOB_LEASE_SECONDS: ${PERSONAL_WIKI_JOB_LEASE_SECONDS:-1800}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      agent-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-db-data:
