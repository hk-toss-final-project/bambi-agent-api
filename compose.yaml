# 로컬 Agent DB의 PostgreSQL 17과 pgvector 실행 환경을 정의한다.

name: bambi-agent-api

services:
  agent-db:
    image: pgvector/pgvector:0.8.1-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_DB_NAME:-bambi_agent}
      POSTGRES_USER: ${AGENT_DB_USER:-bambi_agent}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD must be set in .env}
      AGENT_DB_APPLY_DEV_SEEDS: ${AGENT_DB_APPLY_DEV_SEEDS:-true}
    ports:
      - "127.0.0.1:${AGENT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB && PGHOST=127.0.0.1 /bin/sh /usr/local/bin/run-agent-db-migrations --check"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - agent-db-data:/var/lib/postgresql/data
      - ./database/migrations:/opt/bambi/migrations:ro
      - ./database/seeds:/opt/bambi/seeds:ro
      - ./scripts/run_agent_db_migrations.sh:/usr/local/bin/run-agent-db-migrations:ro
      - ./scripts/initialize_agent_db.sh:/docker-entrypoint-initdb.d/0000_initialize_agent_db.sh:ro
    post_start:
      - command: /bin/sh /usr/local/bin/run-agent-db-migrations
        user: postgres

volumes:
  agent-db-data:
