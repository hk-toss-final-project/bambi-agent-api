[project]
name = "report-builder-agent-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "feedparser>=6.0.12",
    "htmldate>=1.10.0",
    "httpx>=0.27,<0.28",
    "langchain-openai>=1.3.4",
    "langgraph>=1.2.8",
    "openai>=2.44.0",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "tavily-python>=0.7.26",
    "uvicorn>=0.51.0",
    "youtube-search-python>=1.6.6",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 서로 다른 디렉터리에 같은 파일명(test_scoring.py 등)이 있어 기본 prepend 모드에서는
# 모듈명이 충돌해 수집 단계에서 실패한다. importlib 모드는 전체 경로로 모듈을 구분하므로
# 테스트 디렉터리마다 __init__.py 를 두지 않아도 된다.
addopts = "--import-mode=importlib"
