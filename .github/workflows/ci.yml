name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-bookworm
        env:
          POSTGRES_DB: bambi_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bambi_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply Agent DB migrations
        env:
          AGENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bambi_agent_test
          AGENT_DB_MIGRATION_DIR: ${{ github.workspace }}/database/migrations
        run: sh scripts/run_agent_db_migrations.sh

      - name: Run tests
        env:
          AGENT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bambi_agent_test
          PYTHON_DOTENV_DISABLED: "1"
        run: uv run pytest
